name: build-wasm

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a draft GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: emscripten/emsdk@sha256:e856cd59d54fd143366c2df314043d63a1ca23ab43521e0f30f9d9a7ce6d43e0
      options: --user root
    env:
      EMSCRIPTEN_VERSION: '3.1.43'
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y gperf icu-devtools file pkg-config perl libarchive-tools

      - name: Build the matching native helper and WASM
        run: |
          make -j2 native
          make -j2 wasm
          make build/versions.txt

      - name: Install TeX Live and generate WASM formats
        run: |
          make build/texlive-basic.txt
          bash regen-formats.sh
          make build/wasm/texlive-basic.js

      - uses: actions/upload-artifact@v4
        with:
          name: busytex-wasm
          if-no-files-found: error
          path: |
            build/versions.txt
            build/texlive-basic-formats.sha256
            build/wasm/busytex.js
            build/wasm/busytex.wasm
            build/wasm/texlive-basic.js
            build/wasm/texlive-basic.data

  draft-release:
    if: inputs.create_release
    needs: build-wasm
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: busytex-wasm
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build_wasm_${{ github.sha }}_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
            --title "BusyTeX WASM build" \
            versions.txt texlive-basic-formats.sha256 \
            wasm/busytex.js wasm/busytex.wasm wasm/texlive-basic.js wasm/texlive-basic.data
