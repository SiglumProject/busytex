name: build-wasm

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a draft GitHub release from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: emscripten/emsdk@sha256:e856cd59d54fd143366c2df314043d63a1ca23ab43521e0f30f9d9a7ce6d43e0
      options: --user root
    env:
      EMSCRIPTEN_VERSION: '3.1.43'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y gperf icu-devtools file pkg-config perl libarchive-tools

      - name: Build the matching native helper and WASM
        run: |
          make -j2 native
          make -j2 wasm
          make build/versions.txt

      - name: Install TeX Live and generate WASM formats
        run: |
          make build/texlive-basic.txt
          bash regen-formats.sh
          make build/wasm/texlive-basic.js

      - name: Package and smoke-test the release archive
        run: bash package-wasm-release.sh "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: busytex-wasm
          if-no-files-found: error
          path: |
            build/release/busytex-*.tar.gz
            build/release/SHA256SUMS

  draft-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.create_release)
    needs: build-wasm
    runs-on: ubuntu-22.04
    concurrency: busytex-release-${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: busytex-wasm
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release
        shell: bash
        run: |
          shopt -s nullglob
          archives=(busytex-*.tar.gz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          sha256sum -c SHA256SUMS
          tag="${archive%.tar.gz}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "BusyTeX ${tag#busytex-}" \
            --notes "Matched BusyTeX WASM, JavaScript glue and TeX Live data built from $GITHUB_SHA. Verify SHA256SUMS before extracting, then run node smoke-release.cjs in the archive directory." \
            "$archive" SHA256SUMS
