name: Build performance compiler

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: emscripten/emsdk@sha256:e856cd59d54fd143366c2df314043d63a1ca23ab43521e0f30f9d9a7ce6d43e0
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gperf p7zip-full icu-devtools file pkg-config libarchive-tools
      - name: Prepare fresh pinned source
        run: |
          mkdir -p /work
          test ! -e /work/build
          # The pinned container Git predates command-scoped safe.directory.
          git config --global --add safe.directory "$(pwd -P)"
          git archive HEAD | tar -xf - -C /work
          cd /work
          make source/texlive.txt source/expat.txt source/fontconfig.txt
      - name: Compile native helpers and control
        working-directory: /work
        run: make -j4 native
      - name: Compile combined WASM control
        working-directory: /work
        run: make -j4 wasm
      - name: Compile split pdfTeX control
        working-directory: /work
        run: make -j4 wasm-pdftex
      - name: Compile optimized variants from fresh inputs
        working-directory: /work
        run: python3 experimental/checkpoint/build-performance.py --work "$PWD" --output "$PWD/build/performance"
      - name: Upload compiler artifacts and provenance
        uses: actions/upload-artifact@v4
        with:
          name: performance-compiler
          path: |
            /work/build/performance/**/*.wasm
            /work/build/performance/**/*.js
            /work/build/performance/combined/native/
            /work/build/performance/combined/native-resources.json
            /work/build/performance/**/*.json
            /work/build/performance/**/*.c
            /work/build/performance/**/*.h
            /work/build/performance/**/*.inc
            /work/build/performance/*.json
            /work/build/performance/toolchain.txt
            /work/build/wasm/busytex.js
            /work/build/wasm/busytex.wasm
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed variant diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: performance-build-diagnostics
          path: |
            /work/build/performance/**/*.json
            /work/build/performance/**/*.c
            /work/build/performance/**/*.h
            /work/build/performance/**/*.inc
            /work/build/performance/toolchain.txt
          if-no-files-found: ignore
          retention-days: 7
